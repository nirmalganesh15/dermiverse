# Render Blueprint: free web service + free PostgreSQL for client review.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: dermverse
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: dermverse-db
          property: connectionString
      - key: DEMO_ADMIN_USERNAME
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: LOAD_DEMO_DATA
        value: "True"

databases:
  - name: dermverse-db
    plan: free
    databaseName: dermverse
    user: dermverse
